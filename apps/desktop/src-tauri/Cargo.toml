[package]
name = "kiln-desktop"
description = "Kiln desktop and Android shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "kiln"

[[bin]]
name = "kiln"
path = "src/main.rs"

[lib]
# Tauri mobile loads the shell as `libkiln_desktop.so`; desktop links it into the `kiln` binary.
name = "kiln_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
kiln-common.workspace = true
kiln-protocol.workspace = true
kiln-session.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-fs.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-process.workspace = true

# Window size/position memory exists on desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state.workspace = true

[features]
# Set by the Tauri CLI for production builds (serves the bundled frontend instead of devUrl).
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true
