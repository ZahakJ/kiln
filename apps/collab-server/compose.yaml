# The Kiln collaboration relay with its data in a named volume.
#   KILN_COLLAB_TOKEN=<a long random token> docker compose up -d
# Clients connect to ws://<host>:7070/rooms/<room>; put a TLS proxy in front for anything
# beyond a trusted network.
services:
  relay:
    build:
      context: ../..
      dockerfile: apps/collab-server/Dockerfile
    image: kiln-collab-server
    environment:
      KILN_COLLAB_TOKEN: ${KILN_COLLAB_TOKEN:?set KILN_COLLAB_TOKEN to the shared token}
    ports:
      - "7070:7070"
    volumes:
      - kiln-collab-data:/data
    restart: unless-stopped

volumes:
  kiln-collab-data:
