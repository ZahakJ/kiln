# Officina workspace. Every third-party version is pinned ONCE in `catalog:` (PLAN.md §4.2)
# and referenced from packages as "<name>": "catalog:". Append-only; never reorder or bump in packages.
packages:
  - apps/*
  - packages/*
  - e2e

# Dependencies allowed to run install scripts (pnpm 12 blocks all others). Add with `pnpm approve-builds <pkg>`.
allowBuilds:
  esbuild: true

