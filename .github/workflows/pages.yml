# Builds the landing page, the manual and the web app into one site (PLAN.md §4.6). Pages is still
# served from the `docs/` folder of `main` until WP-91 switches the source to GitHub Actions; until
# then the deploy job only runs when the repository variable PAGES_WORKFLOW is '1'.
name: pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'apps/web/**', 'crates/**', 'packages/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The web app runs the core as WebAssembly (PLAN.md §3.5).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: WebAssembly core
        env:
          RUSTC_WRAPPER: ''
          CARGO_BUILD_RUSTC_WRAPPER: ''
        run: |
          curl -4 -LsSf https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/binaryen-version_133/bin:$PATH"
          cargo xtask wasm --release --ci

      - name: Build the web app under /kiln/app/
        run: pnpm --filter @kiln/web exec vite build --base /kiln/app/ --outDir dist-pages

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r docs/. site/
          rm -rf site/adr site/qa
          mkdir -p site/app
          cp -r apps/web/dist-pages/. site/app/
          ls site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    if: vars.PAGES_WORKFLOW == '1'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
