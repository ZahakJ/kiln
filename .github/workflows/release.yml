# Builds every platform package from a version tag and attaches them, with SHA256SUMS.txt, to the
# GitHub Release for that tag (PLAN.md §4.6). docs/RELEASING.md is the runbook.
#
#   linux    AppImage + deb               (tauri-action, profile dist)
#   windows  NSIS .exe + .msi             (tauri-action, profile dist)
#   macos    .dmg for arm64 and x86_64    (tauri-action, profile dist; unsigned until secrets exist)
#   android  three APKs split per ABI     (pnpm tauri android build)
#   web      kiln-web-<version>.tar.gz    (the web build)
#
# Every job asserts the installer size budgets of PLAN.md §3.9 (B13). Only `publish` holds a token
# with write access.
name: release

on:
  push:
    tags: ['v*']
  # A manual run builds and uploads workflow artifacts; it publishes a release only from a tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            targets: ''
          - name: windows
            os: windows-latest
            args: --bundles nsis,msi
            targets: ''
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            targets: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            targets: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}

      - name: Tauri Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The .cargo/config.toml wrapper is sccache; release builds run without it.
      - name: Build the bundles
        uses: tauri-apps/tauri-action@v0
        env:
          RUSTC_WRAPPER: ''
          CARGO_BUILD_RUSTC_WRAPPER: ''
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} -- --profile dist

      - name: Collect the bundles
        shell: bash
        run: |
          mkdir -p out
          find target -path '*/dist/bundle/*' -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"

      # B13: AppImage < 40 MB, deb < 30 MB, NSIS < 30 MB, dmg < 35 MB (PLAN.md §3.9).
      - name: Installer size budget (B13)
        shell: bash
        run: |
          fail=0
          for f in out/*; do
            case "$f" in
              *.AppImage) max=40 ;; *.deb) max=30 ;; *.exe) max=30 ;; *.msi) max=30 ;; *.dmg) max=35 ;; *) continue ;;
            esac
            size=$(wc -c < "$f")
            mb=$(( (size + 1048575) / 1048576 ))
            echo "$(basename "$f"): ${mb} MB (budget ${max} MB)"
            [ "$size" -le $(( max * 1048576 )) ] || fail=1
          done
          exit $fail

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The release keystore comes from repository secrets; without them (forks, first runs) a
      # throwaway key signs the APKs so the pipeline still proves the build.
      - name: Signing key
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          ks="$RUNNER_TEMP/keys/release.jks"
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ks"
            pass="$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::No release keystore secrets; signing with a throwaway key."
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$ks" -alias kiln -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Kiln throwaway, O=Kiln" >/dev/null
          fi
          echo "::add-mask::$pass"
          {
            echo "KILN_KEYSTORE=$ks"
            echo "KILN_KEYSTORE_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      # gen/android is created by WP-89 (`pnpm tauri android init`); until then this job reports
      # that the Android project does not exist yet instead of failing the release.
      - name: Build the APKs
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/29.0.14206865
        run: |
          if [ ! -d apps/desktop/src-tauri/gen/android ]; then
            echo "::warning::apps/desktop/src-tauri/gen/android does not exist yet (WP-89); skipping APKs."
            exit 0
          fi
          pnpm tauri android build --apk --split-per-abi
          mkdir -p out
          version="${GITHUB_REF_NAME#v}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="$(find apps/desktop/src-tauri/gen/android -name "*${abi}*release*.apk" | head -n1)"
            test -n "$apk"
            "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign --ks "$KILN_KEYSTORE" \
              --ks-pass "env:KILN_KEYSTORE_PASSWORD" --out "out/kiln-${version}-${abi}.apk" "$apk"
          done
          ls -la out

      # B13: Android APK (arm64) < 35 MB.
      - name: APK size budget (B13)
        run: |
          shopt -s nullglob
          for f in out/*-arm64-v8a.apk; do
            size=$(wc -c < "$f")
            echo "$(basename "$f"): $(( (size + 1048575) / 1048576 )) MB (budget 35 MB)"
            [ "$size" -le $(( 35 * 1048576 )) ]
          done

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*.apk
          if-no-files-found: ignore

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: WebAssembly core
        env:
          RUSTC_WRAPPER: ''
          CARGO_BUILD_RUSTC_WRAPPER: ''
        run: cargo xtask wasm --release --ci
      - name: Build and pack the web app
        run: |
          pnpm --filter @kiln/web build
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          tar -C apps/web/dist -czf "out/kiln-web-${version}.tar.gz" .
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: out/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [desktop, android, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      - name: SHA256SUMS.txt
        run: |
          cd assets
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
