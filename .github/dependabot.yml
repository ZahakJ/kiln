# Dependency updates, batched: one grouped pull request per ecosystem per week for minor and patch
# versions. Major versions arrive one per pull request, because each is a migration to read. Versions
# are pinned once: npm in the `catalog:` of pnpm-workspace.yaml, Rust in [workspace.dependencies] of
# Cargo.toml. Security advisories bypass this schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # The Tauri Android project (generated by `pnpm tauri android init`, committed from WP-89).
  - package-ecosystem: gradle
    directory: /apps/desktop/src-tauri/gen/android
    schedule:
      interval: weekly
      day: monday
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build
