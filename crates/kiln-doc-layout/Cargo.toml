[package]
name = "kiln-doc-layout"
description = "Paragraph, line and page layout for Kiln Write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kiln-common.workspace = true
kiln-doc.workspace = true
kiln-text = { workspace = true, default-features = false }
kiln-scene.workspace = true
kiln-ooxml.workspace = true
# Symbol-font characters (Wingdings, Symbol…) as Unicode for painting.
kiln-io-docx.workspace = true
rustc-hash.workspace = true
kurbo.workspace = true
# Pictures: PNG, JPEG, GIF and BMP (EMF/WMF are drawn as placeholders).
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kiln-text = { workspace = true, default-features = false, features = ["bundled-fonts"] }

[dev-dependencies]
insta.workspace = true
kiln-raster.workspace = true
kiln-io-docx.workspace = true

[lints]
workspace = true
