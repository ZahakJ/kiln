[package]
name = "kiln-collab-server"
description = "The self-hosted collaboration relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kiln-common.workspace = true
# Rooms and the sync protocol.
kiln-collab.workspace = true
axum = { workspace = true, features = ["ws", "http1", "tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
futures-util = { workspace = true, features = ["sink", "std"] }
# Updates and snapshots of every room, in one file under the data directory.
redb.workspace = true

[dev-dependencies]
kiln-doc.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
