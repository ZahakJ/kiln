[package]
name = "kiln-session"
description = "The facade over the whole core and the only API the shells use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kiln-common.workspace = true
kiln-doc.workspace = true
kiln-doc-layout.workspace = true
kiln-io-docx.workspace = true
# Print, print preview and PDF export (WP-67).
kiln-io-pdf.workspace = true
# Saving Write documents: the original package, the passthrough and package properties (WP-65).
kiln-ooxml.workspace = true
kiln-protocol.workspace = true
kiln-scene.workspace = true
# Spelling as you type in Kiln Write (WP-66).
kiln-spell.workspace = true
# Grid workbooks (WP-70): the model and its file formats; no rayon or ICU data on the web
# (native builds turn the parallel recalculation on below).
kiln-sheet = { workspace = true, default-features = false }
kiln-io-xlsx = { workspace = true, default-features = false }
kiln-io-csv.workspace = true
# The Grid surface and editor (WP-71): sheet layout and painting, formula tokens and docs.
kiln-sheet-layout.workspace = true
kiln-formula = { workspace = true, default-features = false }
# Charts on Grid sheets (WP-73's model, editor and renderer) and their DrawingML theme.
kiln-charts.workspace = true
# Layout of the scratch document. The web core gets no default features (no system fonts, no
# hyphenation dictionaries, no embedded font: the page registers Carlito, apps/scratch/fonts.rs).
kiln-text = { path = "../kiln-text", default-features = false }
rustc-hash.workspace = true
unicode-segmentation.workspace = true
# The Write editor (WP-64): Find and Replace, Kiln's clipboard format, picture headers (WebP
# joins the formats kiln-doc-layout decodes).
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }

# The session thread and its channels exist only on native targets; the web build runs the
# session directly inside a Web Worker.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flume.workspace = true
kiln-io-xlsx = { workspace = true, features = ["parallel"] }
kiln-text = { path = "../kiln-text", default-features = false, features = ["bundled-fonts"] }

[dev-dependencies]
kiln-raster.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
