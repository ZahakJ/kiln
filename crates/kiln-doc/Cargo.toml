[package]
name = "kiln-doc"
description = "The Kiln Write document model, shaped like WordprocessingML"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kiln-common = { workspace = true, features = ["serde"] }
# Themes: converting a DrawingML `a:theme` into the compact theme the model resolves against, and
# the HSL arithmetic behind Word's `w:themeTint`/`w:themeShade`.
kiln-ooxml.workspace = true
serde.workspace = true
postcard.workspace = true
ropey.workspace = true
indexmap = { workspace = true, features = ["serde"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
insta.workspace = true

[lints]
workspace = true
