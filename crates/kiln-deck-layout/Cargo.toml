[package]
name = "kiln-deck-layout"
description = "Slide rendering for Kiln Deck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kiln-common.workspace = true
kiln-deck.workspace = true
kiln-doc.workspace = true
kiln-ooxml.workspace = true
kiln-scene.workspace = true
kiln-protocol.workspace = true
# Charts on slides: read, laid out and drawn by the engine.
kiln-charts.workspace = true
kiln-text = { workspace = true, default-features = false }
kurbo.workspace = true
rustc-hash.workspace = true
postcard.workspace = true
# Pictures: PNG, JPEG, GIF, BMP and WebP (EMF/WMF are drawn as placeholders).
image = { workspace = true, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
kiln-text = { workspace = true, default-features = false, features = ["bundled-fonts"] }

[dev-dependencies]
kiln-raster.workspace = true
kiln-io-pptx.workspace = true

[lints]
workspace = true
