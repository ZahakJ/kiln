[package]
name = "kiln-cli"
description = "The kiln-cli command line (installed as kiln by the Linux packages)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kiln-cli"
path = "src/main.rs"

[dependencies]
kiln-common.workspace = true
# Documents, commands and frames: the same facade the apps use.
kiln-protocol.workspace = true
kiln-session.workspace = true
kiln-scene.workspace = true
kiln-raster.workspace = true
# `inspect`, `repack`.
kiln-ooxml.workspace = true
kiln-io-docx.workspace = true
# `inspect --pptx` (WP-77).
kiln-io-pptx.workspace = true
# `convert` of workbooks, CSV/TSV and JSON (WP-70).
kiln-io-xlsx.workspace = true
kiln-io-csv.workspace = true
kiln-sheet.workspace = true
# `render` of workbooks (WP-71).
kiln-sheet-layout.workspace = true
kiln-text.workspace = true
# `convert … out.pdf` (WP-67).
kiln-io-pdf.workspace = true
kiln-doc-layout.workspace = true
# `eval`.
kiln-formula.workspace = true
# `repack` comparison and `fidelity` (the scorer and its adapter registry).
kiln-testing.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
